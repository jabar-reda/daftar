<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر — مفكرة ملاحظات عربية</title>
<meta name="description" content="دفتر: مفكرة ملاحظات عربية بسيطة تعمل في المتصفح وتحفظ ما تكتبه محلياً، بلا حساب ولا خادم.">
<meta name="author" content="Jabar Reda">
<meta name="keywords" content="دفتر, ملاحظات, مفكرة, تطبيق ويب, عربي, offline, notes">
<meta name="theme-color" content="#e1e0d9">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">

<meta property="og:type" content="website">
<meta property="og:site_name" content="دفتر">
<meta property="og:title" content="دفتر — مفكرة ملاحظات عربية">
<meta property="og:description" content="اكتب، عدّل، وابحث في ملاحظاتك. تعمل في المتصفح وتحفظها محلياً على جهازك.">
<meta property="og:locale" content="ar_AR">

<link rel="icon" href="src/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="src/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
  <main class="ledger">
    <header class="masthead">
      <h1 class="wordmark">دفتر</h1>
      <div class="search">
        <input type="text" id="search" placeholder="بحث" aria-label="بحث في الملاحظات">
      </div>
    </header>

    <form class="composer" id="composer" autocomplete="off">
      <input type="text" id="composer-title" placeholder="العنوان" maxlength="80" aria-label="عنوان الملاحظة">
      <textarea id="composer-body" placeholder="اكتب هنا..." rows="2" aria-label="محتوى الملاحظة"></textarea>
      <div class="composer-footer">
        <button type="submit" class="btn-add">أضف</button>
      </div>
    </form>

    <section class="entries" id="entries"></section>

    <footer class="site-footer">
      <span class="site-version">v0.0.1 · 2026</span>
      <a class="site-github" href="https://github.com/jabar-reda" target="_blank" rel="noopener noreferrer" aria-label="حساب جابر رضا على GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </footer>
  </main>

  <dialog class="confirm" id="confirm-dialog">
    <p class="confirm-text">حذف هذه الملاحظة؟</p>
    <div class="confirm-actions">
      <button type="button" class="btn-text cancel" id="confirm-cancel">إلغاء</button>
      <button type="button" class="btn-text danger" id="confirm-delete">حذف</button>
    </div>
  </dialog>

  <dialog class="popup" id="popup">
    <span class="popup-wordmark">دفتر</span>
    <p class="popup-title">مفكرتك، على جهازك</p>
    <p class="popup-text">كل ما تكتبه يُحفظ في متصفحك وحده.</p>
    <ul class="popup-points">
      <li>تكتب فوراً، بلا تسجيل</li>
      <li>ملاحظاتك على جهازك فقط</li>
      <li>يعمل بلا إنترنت</li>
    </ul>
    <div class="popup-actions">
      <button type="button" class="btn-start js-dismiss">ابدأ الكتابة</button>
      <button type="button" class="btn-quiet js-dismiss">لا تُظهر هذه النافذة مجدداً</button>
    </div>
    <p class="popup-footer">
      من جابر رضا:
      <a class="popup-link js-dismiss" href="https://github.com/jabar-reda" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a class="popup-link js-dismiss" href="https://www.instagram.com/jbr.rda/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </p>
  </dialog>

  <div class="sr-only" aria-live="polite" id="announcer"></div>

<script src="src/js/app.js"></script>
</body>
</html>
